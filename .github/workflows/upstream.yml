name: Upstream

# Epic releases the launcher whenever it likes, so this polls hourly rather
# than waits for a webhook it will never get. It is the repository's
# release: a new upstream version is the only thing that tags, except that
# a version already on trunk without its release gets one on the next run.
# That covers the first version, which came in with the repository rather
# than through this job.
#
# The version only reaches trunk after it has actually built and run. That
# is why this pushes straight to trunk instead of opening a pull request: a
# PR raised by GITHUB_TOKEN does not trigger workflows, so an auto-merged one
# would land unverified.
#
# The weekly move of the flake's inputs is the Weekly update, in update.yml.
# Both commit to trunk, so they share the concurrency group "update".
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.update.outputs.updated }}
      version: ${{ steps.update.outputs.version }}
      previous: ${{ steps.update.outputs.previous }}
      tagged: ${{ steps.tag.outputs.tagged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      # update.sh fails, and this job with it, if the manifest and the
      # download link disagree, or if the new .deb's name, version, Depends
      # or file list are not what package.nix was written for. That is a
      # change for a human to look at, not one to land.
      - name: Check Epic's download service for a newer release
        id: update
        run: |
          previous="$(jq -r .version sources.json)"
          echo "previous=$previous" >>"$GITHUB_OUTPUT"

          nix develop --command ./scripts/update.sh

          version="$(jq -r .version sources.json)"
          echo "version=$version" >>"$GITHUB_OUTPUT"

          if git diff --quiet -- sources.json; then
            echo "updated=false" >>"$GITHUB_OUTPUT"
            echo "Already at $previous." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "updated=true" >>"$GITHUB_OUTPUT"
            echo "\`$previous\` -> \`$version\`" >>"$GITHUB_STEP_SUMMARY"
          fi

      # A release is the tag and the GitHub release that go with it. The
      # version on trunk can be without them: the first one, or one whose
      # publish stopped after the push, before or after the tag. This looks
      # for the GitHub release, which comes last, so a version with its tag
      # but no release still gets one; publish then tags it if it needs to.
      # Any answer from gh other than "release not found" fails the job
      # rather than releasing twice.
      - name: Look for the version's release
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          if gh release view "v$VERSION" --json tagName >/dev/null 2>gh-error.txt; then
            echo "tagged=true" >>"$GITHUB_OUTPUT"
          elif grep -qx "release not found" gh-error.txt; then
            echo "tagged=false" >>"$GITHUB_OUTPUT"
          else
            cat gh-error.txt >&2
            exit 1
          fi

      - name: Upload the candidate sources.json
        if: steps.update.outputs.updated == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sources
          path: sources.json
          retention-days: 1

  verify:
    needs: check
    if: needs.check.outputs.updated == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sources

      - uses: ./.github/actions/build
        with:
          system: ${{ matrix.system }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [check, verify]
    # verify is skipped when there is no new version, which would skip this
    # too, untagged version or not, without saying otherwise here. A failure
    # anywhere before still stops it.
    if: >-
      !cancelled() && !failure() &&
      (needs.check.outputs.updated == 'true' || needs.check.outputs.tagged == 'false')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.check.outputs.updated == 'true'
        with:
          name: sources

      - name: Identify as the Actions bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit
        if: needs.check.outputs.updated == 'true'
        env:
          VERSION: ${{ needs.check.outputs.version }}
          PREVIOUS: ${{ needs.check.outputs.previous }}
        run: |
          git add sources.json
          git commit \
            -m "epic-games-launcher: $PREVIOUS -> $VERSION" \
            -m "Hash taken from the .deb Epic's CDN served, its version cross-checked against stable-target.json and the download link, and its Depends and file list against package.nix. Built and run on x86_64-linux before landing."
          git pull --rebase origin trunk
          git push origin HEAD:trunk

      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # A tag per release, so a consumer can pin one exactly. It goes on
          # the commit that brought the version in: the one just pushed, or,
          # for a version that landed untagged, the last to change sources.json.
          # A version whose earlier publish pushed the tag and then stopped
          # keeps that tag, and only gets its release here.
          if git rev-parse --quiet --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already tagged; releasing it"
          else
            git tag -a "v$VERSION" -m "epic-games-launcher $VERSION" "$(git log -1 --format=%H -- sources.json)"
            git push origin "v$VERSION"
          fi

          # printf rather than a heredoc, whose body would carry this block's
          # YAML indentation into the release notes.
          printf '%s\n' \
            "Epic Games Launcher \`$VERSION\`, repackaged from Epic's Linux .deb." \
            "" \
            "Upstream: https://store.epicgames.com/download" \
            "" \
            "Pin this version:" \
            "" \
            '```nix' \
            "inputs.epic-games-launcher.url = \"github:$REPOSITORY/v$VERSION\";" \
            '```' \
            >notes.md

          gh release create "v$VERSION" \
            --title "epic-games-launcher $VERSION" \
            --notes-file notes.md
