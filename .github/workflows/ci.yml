name: CI

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
    runs-on: ${{ matrix.runner }}
    # A hang guard, not a timing check: the smoke test waits for log lines
    # with no clock of its own, and a launcher that never logs them would
    # otherwise hold the runner for GitHub's six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/build
        with:
          system: ${{ matrix.system }}
          # Pushed from trunk only.
          cachix-auth-token: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # sources.json is machine-written, so the thing worth checking on a pull
  # request is that a human has not hand-edited it into disagreeing with what
  # Epic serves. There is no signed index to compare against, so this
  # downloads the pinned .deb again, from the pinned URL, and checks it
  # against the pinned hash, size and version: a mismatch means either a hand
  # edit or Epic replacing a published build in place, and both want a look.
  # It checks the pin, not Epic's current release, so it says the same thing
  # whatever state upstream is in; following upstream is upstream.yml's job.
  sources-match-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Download the pinned .deb and compare
        run: nix develop --command ./scripts/check-pin.sh
