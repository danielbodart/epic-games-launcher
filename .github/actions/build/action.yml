name: Build and smoke-test
description: >-
  Build epic-games-launcher for one system, then run the result. Shared by
  the CI workflow and by the verification stages of the Upstream and Weekly
  update workflows, so that what lands on trunk is checked exactly the way a
  pull request is.

inputs:
  system:
    description: Nix system double, used only in log output.
    required: true
  cachix-auth-token:
    description: >-
      Write token for the danielbodart Cachix cache. Optional: without one the
      build still runs, it just is not pushed anywhere. CI passes it only on
      trunk.
    required: false
    default: ""
  github-token:
    description: Token for Nix's GitHub API access, to avoid rate limits.
    required: true

runs:
  using: composite
  steps:
    # The FHS environment carries 64- and 32-bit copies of everything Wine
    # might load, over 3 GB of closure, and the runner image leaves less free
    # than that on / once its own toolchains are counted.
    - name: Reclaim runner disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
        df -h /

    # Ubuntu 23.10 and later use AppArmor to stop unprivileged processes
    # creating user namespaces, and the FHS environment is a bubblewrap
    # sandbox, which needs one. NixOS does not apply that restriction, so
    # lifting it here makes the runner behave like the systems this package
    # targets.
    - name: Allow unprivileged user namespaces
      shell: bash
      run: |
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ inputs.github-token }}

    # Pulls only: what is pushed is named below.
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: danielbodart
        authToken: ${{ inputs.cachix-auth-token }}
        skipPush: true

    - name: nix flake check
      shell: bash
      run: nix flake check --print-build-logs

    - name: Build
      shell: bash
      run: nix build .#epic-games-launcher --print-build-logs --out-link result

    # The launcher has no --version or other mode that runs without a
    # display, so this starts it under Xvfb, in the FHS environment users
    # get, and waits for the log lines that say the EOS SDK came up, the
    # self-update switch took, and the window was revealed. It also checks
    # the version the launcher reports against sources.json. See the script
    # for the detail. It waits on the launcher, not on a clock: a launcher
    # that hangs is ended by the job's own time limit.
    - name: Run the packaged launcher
      shell: bash
      run: |
        nix develop --command ./scripts/smoke-test.sh ./result/bin/epic-games-launcher
        echo "epic-games-launcher started on ${{ inputs.system }}"

    # The package outputs and their closures, and nothing else: not the
    # checks' builds (the cache's 5 GB free tier).
    - name: Push the packages to Cachix
      if: inputs.cachix-auth-token != ''
      shell: bash
      run: nix build --print-out-paths .#epic-games-launcher .#epic-games-launcher-unwrapped | cachix push danielbodart

    - name: Report closure size
      shell: bash
      run: nix path-info --closure-size --human-readable ./result
